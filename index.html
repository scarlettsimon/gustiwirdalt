<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Happy Birthday Gusti!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#000; font-family:'Trebuchet MS', system-ui, sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* ---------- PHASE 1: Hut aufsetzen ---------- */
  #person {
    position:absolute;
    left:50%; top:52%;
    transform:translate(-50%,-50%);
    width:min(48vw, 230px);
    z-index:2;
    text-align:center;
    transition:transform 1.2s cubic-bezier(.4,0,.2,1), opacity .6s;
  }
  #person-img { width:100%; height:auto; background:none; object-fit:contain; display:block; }
  #head-target { position:absolute; left:50%; top:14%; width:44%; height:20%; transform:translateX(-50%); }

  #hat {
    position:absolute;
    width:min(34vw, 150px);
    z-index:5;
    cursor:grab;
    touch-action:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));
  }
  #hat.grabbing { cursor:grabbing; }
  #hat svg { width:100%; height:auto; display:block; pointer-events:none; }

  #hint {
    position:absolute; left:50%; top:82%;
    transform:translate(-50%,-50%);
    color:#fff; font-size:clamp(1.4rem, 6vw, 2.4rem);
    font-weight:bold; text-align:center; width:90%;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
    letter-spacing:1px; z-index:6; pointer-events:none;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.85} 50%{opacity:1; transform:translate(-50%,-50%) scale(1.04)} }

  /* ---------- PHASE 2: Happy Birthday ---------- */
  #celebrate {
    position:absolute; inset:0; z-index:10;
    display:none; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding-top:8vh; text-align:center; pointer-events:none;
    transition:opacity .8s;
  }
  #celebrate h1 {
    color:#ffd93b; font-size:clamp(2rem, 11vw, 4.5rem);
    text-shadow:0 0 20px rgba(255,217,59,.6), 0 4px 10px rgba(0,0,0,.7);
    animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  #celebrate .name {
    color:#fff; font-size:clamp(1.3rem, 6vw, 2.2rem);
    margin-top:10px; font-weight:bold;
    animation:pop .6s .2s cubic-bezier(.2,1.4,.4,1) both;
  }
  #celebrate .msg {
    color:#e8e8e8; font-size:clamp(1rem, 4.2vw, 1.3rem);
    margin-top:14px; max-width:85%; line-height:1.5;
    animation:pop .6s .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop { from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)} }

  .confetti { position:absolute; top:-20px; width:12px; height:18px; z-index:9; will-change:transform; }

  /* ---------- ABHOL-SCHIFF (Übergang, auf Schwarz) ---------- */
  #pickup {
    position:absolute; left:50%; z-index:8;
    width:min(46vw, 200px);
    transform:translate(-50%,0);
    top:120vh;
    display:none;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.7));
  }
  #pickup svg { width:100%; height:auto; display:block; }

  /* ---------- PHASE 3: Schatzkarte ---------- */
  #map {
    position:absolute; inset:0; z-index:20;
    display:none; opacity:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(160deg, #f2e2bd 0%, #e8d3a3 45%, #dcc189 100%);
    transition:opacity 1.2s ease;
    overflow:hidden;
  }
  #map.show { opacity:1; }
  #map::after {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:25;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(90,60,20,.35) 100%);
  }

  #map-title {
    position:absolute; top:2.5%; left:50%; transform:translateX(-50%);
    font-size:clamp(1.05rem, 4.8vw, 1.7rem); font-weight:bold;
    color:#5b3a12; letter-spacing:1px; text-align:center; width:90%;
    z-index:26;
  }
  #map-sub {
    position:absolute; top:calc(2.5% + 2em); left:50%; transform:translateX(-50%);
    font-size:clamp(.8rem, 3.4vw, 1rem);
    color:#7a5423; text-align:center; width:90%; z-index:26;
  }

  /* Karte oben, Anzeige unten – klar getrennt */
  #map-svg {
    position:absolute;
    top:7%; height:75%;
    width:100%;
    left:50%; transform:translateX(-50%);
    z-index:21;
  }
  /* Auf breiten Bildschirmen (Desktop/Querformat): Karte hochformatig
     in die Mitte statt über die volle Breite -> kein extremer Zoom */
  @media (min-aspect-ratio: 3/4) {
    #map-svg { width:min(100%, 37.5vh); }
  }

  #ship {
    position:absolute; z-index:23;
    width:min(28vw, 11vh, 120px);
    animation:bob 3s ease-in-out infinite;
    pointer-events:none;
    transition:left 1.4s cubic-bezier(.45,0,.3,1), top 1.4s cubic-bezier(.45,0,.3,1);
  }
  @keyframes bob {
    0%,100% { transform:translate(-50%,-72%) rotate(-2.5deg); }
    50%     { transform:translate(-50%,-77%) rotate(2.5deg); }
  }
  #ship-face { position:absolute; left:50%; top:0; transform:translate(-50%,-88%); width:50%; z-index:2; }
  #ship-face img { width:100%; display:block; }
  #ship-hat {
    position:absolute; left:56%; top:2%;
    transform:translate(-50%,-8%);
    width:66%; z-index:3; pointer-events:none;
  }
  #ship-hat svg { width:100%; height:auto; display:block; }
  #ship > svg { width:100%; height:auto; display:block; position:relative; z-index:1; }

  /* ---------- GEGNER-SCHIFF ---------- */
  #enemy-ship {
    position:absolute; z-index:22;
    width:min(26vw, 10vh, 110px);
    animation:bobEnemy 3.4s ease-in-out infinite;
    pointer-events:none;
    transition:left 1.4s cubic-bezier(.45,0,.3,1), top 1.4s cubic-bezier(.45,0,.3,1);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
    display:none;
  }
  @keyframes bobEnemy {
    0%,100% { transform:translate(-50%,-72%) rotate(2.5deg); }
    50%     { transform:translate(-50%,-77%) rotate(-2.5deg); }
  }
  #enemy-ship > svg { width:100%; height:auto; display:block; position:relative; z-index:1; }
  /* Foto sitzt gut sichtbar direkt über dem Rumpf */
  #enemy-face {
    position:absolute; left:50%; top:0;
    transform:translate(-50%,-80%);
    width:52%; z-index:3;
  }
  #enemy-face img {
    width:100%; display:block; border-radius:50%;
    border:2px solid #2a2a2a; aspect-ratio:1/1; object-fit:cover;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  /* Flagge deutlich HÖHER, damit sie das Foto nicht überdeckt */
  #enemy-flag {
    position:absolute; left:50%; top:0;
    transform:translate(-50%,-155%);
    width:42%; z-index:2; pointer-events:none;
  }
  #enemy-flag svg { width:100%; height:auto; display:block; }

  /* ---------- KANONENKUGELN ---------- */
  .cannonball {
    position:absolute; z-index:28;
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6a6a6a, #1a1a1a 70%);
    box-shadow:0 0 6px rgba(0,0,0,.6);
    pointer-events:none;
    will-change:transform, left, top;
  }
  .splash {
    position:absolute; z-index:27;
    width:26px; height:26px;
    pointer-events:none;
    border-radius:50%;
    border:2px solid rgba(120,90,40,.7);
    transform:translate(-50%,-50%) scale(0);
  }

  /* ---------- FLASCHENPOST ---------- */
  #bottle {
    position:absolute; z-index:24;
    width:min(15vw, 6vh, 64px);
    display:none;
    cursor:pointer;
    pointer-events:auto;
    transform:translate(-50%,-50%);
    animation:bottleBob 2.6s ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
  }
  #bottle svg { width:100%; height:auto; display:block; pointer-events:none; }
  @keyframes bottleBob {
    0%,100% { transform:translate(-50%,-50%) rotate(-9deg); }
    50%     { transform:translate(-50%,-56%) rotate(9deg); }
  }
  /* pulsierender Ring, damit man merkt: anklicken! */
  #bottle::before {
    content:''; position:absolute; left:50%; top:50%;
    width:220%; height:220%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px solid rgba(192,57,43,.6);
    animation:bottleRing 1.8s ease-out infinite;
    pointer-events:none;
  }
  @keyframes bottleRing {
    0%   { opacity:.8; transform:translate(-50%,-50%) scale(.6); }
    100% { opacity:0;  transform:translate(-50%,-50%) scale(1.3); }
  }

  #bottle-hint {
    position:absolute; z-index:24;
    display:none;
    transform:translate(-50%,0);
    color:#5b3a12; font-weight:bold;
    font-size:clamp(.85rem, 3.6vw, 1.1rem);
    text-align:center; width:max-content; max-width:60vw;
    text-shadow:0 1px 4px rgba(242,226,189,.9);
    pointer-events:none;
    animation:pulse2 1.8s ease-in-out infinite;
  }
  @keyframes pulse2 { 0%,100%{opacity:.7} 50%{opacity:1} }

  /* Flaschenpost-Overlay (die geöffnete Nachricht) */
  #letter {
    position:absolute; inset:0; z-index:40;
    display:none; opacity:0;
    align-items:center; justify-content:center;
    background:rgba(30,18,4,.7);
    backdrop-filter:blur(3px);
    transition:opacity .5s ease;
    padding:24px;
  }
  #letter.show { opacity:1; }
  #letter-inner {
    position:relative;
    width:min(90vw, 460px);
    max-height:82vh; overflow-y:auto;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(139,90,30,.06) 31px),
      linear-gradient(160deg, #fbf3dc 0%, #f3e4bd 100%);
    border:3px solid #b08a48;
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(180,140,70,.25);
    padding:30px 26px 34px;
    text-align:center;
    transform:scale(.7) rotate(-2deg);
    transition:transform .6s cubic-bezier(.2,1.4,.4,1);
  }
  #letter.show #letter-inner { transform:scale(1) rotate(0deg); }
  /* leicht angebrannte Ecken */
  #letter-inner::before, #letter-inner::after {
    content:''; position:absolute; width:60px; height:60px; pointer-events:none;
    background:radial-gradient(circle at center, rgba(90,50,10,.35), transparent 70%);
  }
  #letter-inner::before { top:-10px; left:-10px; }
  #letter-inner::after  { bottom:-10px; right:-10px; }

  #letter-inner h2 {
    color:#7a2a12; font-size:clamp(1.2rem, 5.5vw, 1.8rem);
    letter-spacing:1px; margin-bottom:4px;
  }
  #letter-date {
    color:#9a7038; font-size:clamp(.75rem, 3.2vw, .9rem);
    margin-bottom:16px; font-style:italic;
  }
  #letter-divider {
    width:70%; height:2px; margin:0 auto 18px;
    background:linear-gradient(90deg, transparent, #b08a48, transparent);
  }
  #letter-task {
    color:#3a2410; font-size:clamp(1.05rem, 4.6vw, 1.35rem);
    line-height:1.6; white-space:pre-wrap;
  }
  #letter-close {
    margin-top:26px;
    display:inline-block;
    background:linear-gradient(#c0392b,#a5281b);
    color:#fff; font-weight:bold;
    font-size:clamp(.95rem, 4vw, 1.1rem);
    padding:12px 30px; border-radius:99px;
    border:none; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    letter-spacing:.5px;
  }
  #letter-close:active { transform:translateY(2px); }

  /* Anzeige-Bereich unten – eigener Streifen, Schiff kann nicht drüber */
  #progress-box {
    position:absolute; bottom:0; left:0; width:100%;
    height:22%;
    min-height:130px;
    padding-bottom:9vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    z-index:26; text-align:center;
    background:linear-gradient(to top, rgba(220,193,137,.98) 50%, rgba(220,193,137,0));
  }
  #pct {
    font-size:clamp(2rem, 9vw, 3rem); font-weight:bold;
    color:#5b3a12; line-height:1;
  }
  #pct-label { font-size:clamp(.8rem,3.4vw,1rem); color:#7a5423; margin-top:4px; }
  #bar {
    margin:10px auto 0; width:min(80%, 340px); height:10px;
    background:rgba(90,60,20,.18); border-radius:99px; overflow:hidden;
    border:1px solid rgba(90,60,20,.3);
  }
  #bar-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#c0392b,#e67e22,#ffd93b);
    border-radius:99px; transition:width 1.6s ease;
  }

  /* Finale */
  #found {
    position:absolute; inset:0; z-index:30; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 55%, rgba(255,217,59,.18), rgba(0,0,0,.95) 70%);
    text-align:center; padding:20px; pointer-events:none;
    overflow:hidden;
  }

  /* Lichtstrahl */
  #beam {
    position:absolute; left:50%; bottom:20%;
    width:min(70vw, 320px); height:60vh;
    transform:translateX(-50%) scaleY(0);
    transform-origin:bottom center;
    background:linear-gradient(to top,
      rgba(255,217,59,.85) 0%,
      rgba(255,217,59,.35) 40%,
      rgba(255,217,59,0) 100%);
    clip-path:polygon(38% 100%, 62% 100%, 100% 0, 0 0);
    filter:blur(6px);
    opacity:0;
    z-index:31;
  }
  #found.open #beam {
    animation:beamUp 1.4s .5s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes beamUp {
    from { transform:translateX(-50%) scaleY(0); opacity:0; }
    to   { transform:translateX(-50%) scaleY(1); opacity:1; }
  }

  /* Truhe */
  #chest {
    position:absolute; left:50%; bottom:14%;
    transform:translateX(-50%);
    width:min(52vw, 220px);
    z-index:33;
    animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  #chest svg { width:100%; height:auto; display:block;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.7)); }

  /* Deckel klappt auf */
  #chest-lid {
    transform-origin:100px 88px;
    transition:transform 1s cubic-bezier(.4,1.6,.5,1);
  }
  #found.open #chest-lid {
    transform:rotate(-108deg) translateY(-6px);
  }

  /* Der Schatz */
  #treasure {
    position:absolute; left:50%; top:16%;
    transform:translateX(-50%);
    width:90%; max-width:520px;
    z-index:34; opacity:0;
  }
  #found.open #treasure {
    animation:treasureRise 1.2s 1.1s cubic-bezier(.2,1.2,.4,1) forwards;
  }
  @keyframes treasureRise {
    from { opacity:0; transform:translateX(-50%) translateY(40px) scale(.8); }
    to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }
  #treasure h1 {
    color:#ffd93b; font-size:clamp(1.7rem,8.5vw,3.2rem);
    text-shadow:0 0 30px rgba(255,217,59,.9), 0 0 60px rgba(255,217,59,.4);
    letter-spacing:1px;
  }
  .treasure-text {
    color:#fff; font-size:clamp(1rem,4.2vw,1.25rem);
    margin-top:14px; line-height:1.55;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  .treasure-img {
    max-width:100%; max-height:34vh; margin-top:16px;
    border-radius:10px; border:3px solid #f0c14b;
    box-shadow:0 0 30px rgba(255,217,59,.5);
  }
</style>
</head>
<body>
<div id="stage">

  <!-- ===== PHASE 1 ===== -->
  <div id="hint">Ziehe dir den Hut an</div>

  <div id="person">
    <img id="person-img" src="Gusti.PNG" alt="Gusti">
    <div id="head-target"></div>
  </div>

  <div id="hat">
    <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="95" rx="95" ry="28" fill="#f0c14b" stroke="#c8952f" stroke-width="3"/>
      <ellipse cx="100" cy="90" rx="95" ry="28" fill="#f7d772"/>
      <path d="M40 92 Q100 118 160 92 L160 88 Q100 112 40 88 Z" fill="#e0b03e"/>
      <path d="M45 90 Q45 40 100 38 Q155 40 155 90 Q100 72 45 90 Z" fill="#f7d772" stroke="#c8952f" stroke-width="2"/>
      <rect x="45" y="72" width="110" height="16" rx="4" fill="#c0392b"/>
      <path d="M45 80 Q100 96 155 80 L155 88 Q100 104 45 88 Z" fill="#a5281b"/>
    </svg>
  </div>

  <!-- ===== PHASE 2 ===== -->
  <div id="celebrate">
    <h1>Happy Birthday!</h1>
    <div class="name" id="c-name">Gusti</div>
    <div class="msg" id="c-msg"></div>
  </div>

  <!-- ===== ABHOL-SCHIFF ===== -->
  <div id="pickup">
    <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
      <rect x="96" y="20" width="6" height="70" fill="#7b4a1e"/>
      <path d="M102 26 Q140 45 102 64 Z" fill="#fdfaf2" stroke="#d8cdb4" stroke-width="1.5"/>
      <path d="M98 30 Q60 48 98 66 Z" fill="#fdfaf2" stroke="#d8cdb4" stroke-width="1.5"/>
      <rect x="102" y="12" width="26" height="16" fill="#1a1a1a"/>
      <circle cx="112" cy="20" r="4" fill="#fff"/>
      <path d="M107 25 L119 15 M107 15 L119 25" stroke="#fff" stroke-width="1.6"/>
      <path d="M30 92 L170 92 L150 128 Q100 138 50 128 Z" fill="#c8752f" stroke="#8a4a18" stroke-width="2"/>
      <path d="M30 92 L170 92 L166 100 L34 100 Z" fill="#e0913f"/>
      <circle cx="176" cy="86" r="11" fill="#f2e2bd" stroke="#8a4a18" stroke-width="2"/>
      <circle cx="180" cy="84" r="1.8" fill="#333"/>
      <path d="M168 80 q-6 -6 -2 -10" stroke="#8a4a18" stroke-width="2.5" fill="none"/>
      <circle cx="70" cy="108" r="5" fill="#f7d772" stroke="#8a4a18" stroke-width="1.5"/>
      <circle cx="100" cy="110" r="5" fill="#f7d772" stroke="#8a4a18" stroke-width="1.5"/>
      <circle cx="130" cy="108" r="5" fill="#f7d772" stroke="#8a4a18" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- ===== PHASE 3: Schatzkarte ===== -->
  <div id="map">
    <div id="map-title">🏴‍☠️ Die Reise zum One Piece</div>
    <div id="map-sub">Kurs auf den Schatz · Ankunft: ???</div>

    <svg id="map-svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <g stroke="#b99a5f" stroke-width="1" opacity=".35" fill="none">
        <path d="M20 220 q20 -8 40 0 t40 0"/>
        <path d="M300 280 q20 -8 40 0 t40 0"/>
        <path d="M40 620 q20 -8 40 0 t40 0"/>
        <path d="M280 680 q20 -8 40 0 t40 0"/>
      </g>

      <g transform="translate(345,190)" opacity=".5">
        <circle r="24" fill="none" stroke="#8a6a35" stroke-width="2"/>
        <path d="M0 -20 L5 0 L0 20 L-5 0 Z" fill="#c0392b"/>
        <path d="M-20 0 L0 -5 L20 0 L0 5 Z" fill="#8a6a35"/>
        <text x="0" y="-29" text-anchor="middle" font-size="11" fill="#8a6a35" font-weight="bold">N</text>
      </g>

      <!-- Inseln werden per JS aus ISLANDS erzeugt -->
      <g id="islands"></g>

      <path id="route-done"
            d="M200 700 C 120 640, 300 560, 200 480 S 90 380, 220 300 S 320 260, 200 205"
            fill="none" stroke="#c0392b" stroke-width="5"
            stroke-linecap="round" opacity=".9"/>

      <path id="route"
            d="M200 700 C 120 640, 300 560, 200 480 S 90 380, 220 300 S 320 260, 200 205"
            fill="none" stroke="#8a3b12" stroke-width="4"
            stroke-dasharray="12 12" stroke-linecap="round" opacity=".85"/>

      <circle cx="200" cy="700" r="7" fill="#5b3a12"/>
      <text x="200" y="726" text-anchor="middle" font-size="15" fill="#5b3a12" font-weight="bold">START</text>

      <g transform="translate(200,205)">
        <circle r="30" fill="none" stroke="#c0392b" stroke-width="2" opacity=".4"/>
        <path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
        <text x="0" y="-42" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">ONE PIECE</text>
      </g>
    </svg>

    <!-- ===== GEGNER-SCHIFF (LeninaBallerina) ===== -->
    <div id="enemy-ship">
      <!-- Schwarze Piratenflagge (Totenkopf) -->
      <div id="enemy-flag">
        <svg viewBox="0 0 90 78" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="4" width="4" height="72" fill="#2a2a2a"/>
          <path d="M10 6 L84 6 L84 44 L10 44 Z" fill="#111" stroke="#000" stroke-width="1"/>
          <path d="M10 6 L84 6 L84 44 L10 44 Z" fill="none" stroke="#444" stroke-width="1.5"/>
          <!-- Totenkopf -->
          <g transform="translate(47,23)" fill="#f2f2f2">
            <ellipse cx="0" cy="-2" rx="11" ry="10"/>
            <rect x="-8" y="4" width="16" height="7" rx="3"/>
            <circle cx="-4.5" cy="-3" r="3" fill="#111"/>
            <circle cx="4.5" cy="-3" r="3" fill="#111"/>
            <path d="M0 1 l-2.2 4 h4.4 Z" fill="#111"/>
          </g>
          <!-- gekreuzte Knochen -->
          <g stroke="#f2f2f2" stroke-width="4" stroke-linecap="round">
            <path d="M34 42 L60 18"/>

/* ---- INSELN / ETAPPEN ----

/* ---- FLASCHENPOST-TAGE ----
   An diesen Tagen kommt das Schiff vom Kurs ab und dockt an einer
   treibenden Flaschenpost an. Gusti tippt sie an -> Aufgabe erscheint.

   date = Datum (Jahr, Monat-1, Tag) -> Monat ist 0-basiert! Januar=0, ... Dezember=11
   task = Der Text in der Flasche (\n macht einen Zeilenumbruch)
   kind = "task"  -> Aufgabe: Schiff macht den Abstecher (Standard, kann weggelassen werden)
          "reply" -> Antwort/Bestätigung: Schiff bleibt AUF KURS, nur eine kurze Botschaft
          "enemy" -> Nachricht der Gegnerin: erscheint beim GEGNER-Schiff.
                     Kann mit "until" einen Zeitraum bekommen (mehrere Tage sichtbar).

   until = (optional) Enddatum -> Nachricht ist von "date" bis "until" (einschliesslich) sichtbar.

   Du kannst so viele Einträge hinzufügen, wie du willst.
*/
const BOTTLE_MESSAGES = [
  {

];
/* ======================================= */

/* ---- Aktuelles Datum (mit Test-Möglichkeit) ----
   Normal: echtes Datum von heute.
   Zum Testen: ?date=2026-09-05 an die URL hängen.
   Beispiel: .../gustiwirdalt/?date=2026-09-05                */
function today(){
  const param = new URLSearchParams(location.search).get('date');
  if(param){
    const d = new Date(param);
    if(!isNaN(d)) return d;
  }
  return new Date();
}

/* Prüft, ob zwei Daten am selben Kalendertag liegen */
function sameDay(a, b){
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth() &&
         a.getDate()     === b.getDate();
}

/* Prüft, ob "now" im Zeitraum [start, end] liegt (tagesgenau, inkl. Rändern) */
function inDayRange(now, start, end){
  const n = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const s = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const e = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  return n >= s && n <= e;
}

/* Gibt die "normale" Flaschenpost (task/reply) für heute zurück (oder null) */
function bottleForToday(){
  const now = today();
  for(const b of BOTTLE_MESSAGES){
    if(b.kind === "enemy") continue;   // Gegner-Nachrichten separat
    if(sameDay(now, b.date)) return b;
  }
  return null;
}

/* Gibt die aktive Gegner-Nachricht (LeninaBallerina) für heute zurück (oder null) */
function enemyBottleForToday(){
  const now = today();
  for(const b of BOTTLE_MESSAGES){
    if(b.kind !== "enemy") continue;
    const end = b.until ? b.until : b.date;   // ohne "until" nur ein Tag
    if(inDayRange(now, b.date, end)) return b;
  }
  return null;
}

document.getElementById('c-name').textContent = NAME;
document.getElementById('c-msg').textContent  = MESSAGE;

const stage  = document.getElementById('stage');
const hat    = document.getElementById('hat');
const person = document.getElementById('person');
const pickup = document.getElementById('pickup');
let done = false;

/* ---------- Hut zufällig platzieren ---------- */
function placeHatRandom(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const hw = hat.offsetWidth, hh = hat.offsetHeight;
  let x, y, tries=0;
  const cx = w/2, cy = h*0.2;
  do {
    x = Math.random()*(w-hw);
    y = Math.random()*(h-hh);
    tries++;
  } while (Math.hypot(x-cx, y-cy) < Math.min(w,h)*0.28 && tries<30);
  hat.style.left = x+'px';
  hat.style.top  = y+'px';
}
window.addEventListener('load', placeHatRandom);

/* ---------- Drag ---------- */
let dragging=false, offX=0, offY=0;
function start(e){
  if(done) return;
  dragging=true; hat.classList.add('grabbing');
  const p = point(e);
  const r = hat.getBoundingClientRect();
  offX = p.x - r.left; offY = p.y - r.top;
  e.preventDefault();
}
function move(e){
  if(!dragging) return;
  const p = point(e);
  hat.style.left = (p.x - offX) + 'px';
  hat.style.top  = (p.y - offY) + 'px';
  e.preventDefault();
}
function endDrag(){
  if(!dragging) return;
  dragging=false; hat.classList.remove('grabbing');
  checkHit();
}
function point(e){
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX, y:t.clientY};
}
hat.addEventListener('mousedown', start);
window.addEventListener('mousemove', move);
window.addEventListener('mouseup', endDrag);
hat.addEventListener('touchstart', start, {passive:false});
window.addEventListener('touchmove', move, {passive:false});
window.addEventListener('touchend', endDrag);

/* ---------- Treffer ---------- */
function checkHit(){
  const target = document.getElementById('head-target').getBoundingClientRect();
  const hr = hat.getBoundingClientRect();
  const hatCx = hr.left + hr.width/2;
  const hatCy = hr.top + hr.height/2;
  if(hatCx > target.left - 30 && hatCx < target.right + 30 &&
     hatCy > target.top - 60 && hatCy < target.bottom + 40){
    snapAndCelebrate(target);
  }
}

let hatOffsetFromPerson = {x:0, y:0};

function snapAndCelebrate(target){
  done = true;
  hat.style.transition='left .2s, top .2s';
  const hatLeft = target.left + target.width/2 - hat.offsetWidth/2 + hat.offsetWidth*0.12;
  const hatTop  = target.top - hat.offsetHeight*0.35;
  hat.style.left = hatLeft + 'px';
  hat.style.top  = hatTop + 'px';
  document.getElementById('hint').style.display='none';

  // Hut-Position relativ zur Person merken (damit er beim Wegfahren mitgeht)
  const pr = person.getBoundingClientRect();
  hatOffsetFromPerson = { x: hatLeft - pr.left, y: hatTop - pr.top };

  setTimeout(()=>{
    document.getElementById('celebrate').style.display='flex';
    burstConfetti();
  }, 220);

  // Übergang: Boot holt ihn ab
  setTimeout(startPickup, 1500);
}

/* ---------- Konfetti ---------- */
const COLORS = ['#ffd93b','#ff5252','#4dd0e1','#69f0ae','#ff80ab','#fff'];
function burstConfetti(){
  for(let i=0;i<120;i++) setTimeout(spawnConfetto, i*25);
}
function spawnConfetto(){
  const c = document.createElement('div');
  c.className='confetti';
  c.style.left = Math.random()*100 + 'vw';
  c.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
  c.style.borderRadius = Math.random()<.5 ? '2px' : '50%';
  const dur = 2.5 + Math.random()*2;
  const drift = (Math.random()*2-1)*120;
  c.animate([
    {transform:`translate(0,0) rotate(0deg)`, opacity:1},
    {transform:`translate(${drift}px, 110vh) rotate(${720+Math.random()*720}deg)`, opacity:1}
  ], {duration:dur*1000, easing:'ease-in'});
  stage.appendChild(c);
  setTimeout(()=>c.remove(), dur*1000);
}

/* ---------- ÜBERGANG: Boot fährt in Kurven ran, lädt ein, fährt runter ---------- */
function startPickup(){
  const celebrate = document.getElementById('celebrate');
  const pr = person.getBoundingClientRect();
  const W  = window.innerWidth;
  const H  = window.innerHeight;

  const dockTop = pr.bottom - pickup.offsetHeight * 0.45;

  pickup.style.display = 'block';
  pickup.style.left = '50%';
  pickup.style.top  = '115vh';
  pickup.style.transition = 'none';
  pickup.style.transform = 'translate(-50%,0)';

  // Bewegung per Keyframes: rein, zwei Kurven, dann andocken
  const anim = pickup.animate([
    // von unten rechts reinfahren
    { top: H*1.15 + 'px', transform:'translate(-50%,0) translateX(' + (W*0.32) + 'px) rotate(6deg)' },
    // erste Kurve: nach links schwingen
    { top: H*0.78 + 'px', transform:'translate(-50%,0) translateX(' + (-W*0.30) + 'px) rotate(-8deg)', offset:.28 },
    // zweite Kurve: zurück nach rechts
    { top: H*0.62 + 'px', transform:'translate(-50%,0) translateX(' + (W*0.26) + 'px) rotate(7deg)',  offset:.56 },
    // einschwenken zur Mitte
    { top: (dockTop + 40) + 'px', transform:'translate(-50%,0) translateX(' + (-W*0.08) + 'px) rotate(-3deg)', offset:.82 },
    // andocken
    { top: dockTop + 'px', transform:'translate(-50%,0) translateX(0) rotate(0deg)' }
  ], {
    duration: 7200,
    easing: 'ease-in-out',
    fill: 'forwards'
  });

  // Person steigt ein, sobald das Boot da ist
  setTimeout(()=>{
    person.style.transition = 'transform 1s cubic-bezier(.4,0,.2,1)';
    person.style.transform = 'translate(-50%,-50%) translateY(28px) scale(.82)';
    hat.style.transition = 'transform 1s cubic-bezier(.4,0,.2,1)';
    hat.style.transform = 'translateY(28px) scale(.82)';
    hat.style.transformOrigin = 'center bottom';
    celebrate.style.opacity = '0';
  }, 7300);

  // Boot + Person fahren zusammen nach unten raus
  setTimeout(()=>{
    const dist = H * 1.2;
    pickup.animate([
      { top: dockTop + 'px', transform:'translate(-50%,0) rotate(0deg)' },
      { top: (dockTop + dist) + 'px', transform:'translate(-50%,0) rotate(2deg)' }
    ], { duration:1600, easing:'cubic-bezier(.5,0,.7,1)', fill:'forwards' });

    person.style.transition = 'transform 1.6s cubic-bezier(.5,0,.7,1), opacity .4s 1.2s';
    person.style.transform = `translate(-50%,-50%) translateY(${28 + dist}px) scale(.82)`;
    person.style.opacity = '0';

    hat.style.transition = 'transform 1.6s cubic-bezier(.5,0,.7,1), opacity .4s 1.2s';
    hat.style.transform = `translateY(${28 + dist}px) scale(.82)`;
    hat.style.opacity = '0';

    celebrate.style.display = 'none';
  }, 8400);

  // Karte einblenden
  setTimeout(showMap, 9900);
}

/* ---------- Fortschritt aus echtem Datum ---------- */
function getProgress(){
  const now = today();
  const total = END_DATE - START_DATE;
  const elapsed = now - START_DATE;
  let p = elapsed / total;
  if(p < 0) p = 0;
  if(p > 1) p = 1;
  return p;
}

/* ---------- Insel-Helfer ---------- */
function dateToProgress(d){
  let p = (d - START_DATE) / (END_DATE - START_DATE);
  return Math.max(0, Math.min(1, p));
}

/* Welche Insel ist gerade dran?
   Rückgabe: {index, state}
   state: "at" = liegt gerade dort, "next" = nächste anzustreuernde  */
function currentIslandInfo(){
  const now = today();
  for(let i=0; i<ISLANDS.length; i++){
    const is = ISLANDS[i];
    if(now >= is.arrive && now <= is.leave) return {index:i, state:"at"};
    if(now < is.arrive) return {index:i, state:"next"};
  }
  return {index:-1, state:"done"};
}

            </g>
            <circle cx="-8" cy="5" r="1.6" fill="#c0392b"/>
            <circle cx="8" cy="5" r="1.6" fill="#c0392b"/>`;
  }
  if(type === "wave"){
    return `<g stroke="#c0392b" stroke-width="2.6" stroke-linecap="round">
              <path d="M-11 0 L-11 0"/>
              <path d="M-11 -3 L-11 3"/>
              <path d="M-7 -7 L-7 7"/>
              <path d="M-3.5 -11 L-3.5 11"/>
              <path d="M0 -5 L0 5"/>
              <path d="M3.5 -12 L3.5 12"/>
              <path d="M7 -6 L7 6"/>
              <path d="M11 -3 L11 3"/>
            </g>`;
  }
  return `<text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6a35">?</text>`;
}

/* Inseln entlang der Route platzieren */
function drawIslands(){
  const route = document.getElementById('route');
  const g     = document.getElementById('islands');
  g.innerHTML = '';

  const len  = route.getTotalLength();
  const info = currentIslandInfo();

  ISLANDS.forEach((is, i) => {
    const p  = route.getPointAtLength(len * dateToProgress(is.arrive));
    const pt = p;

    // Insel seitlich versetzt (abwechselnd links/rechts)
    const side = (i % 2 === 0) ? -1 : 1;
    const ix = pt.x + side * 78;
    const iy = pt.y;

    const active   = (info.state === "at" && i === info.index);
    const passed   = (today() > is.leave);
    // Zukünftige Inseln: sichtbar, aber ohne Name/Symbol
    const revealed = (info.state === "done") || (i <= info.index);

    const el = document.createElementNS('http://www.w3.org/2000/svg','g');
    el.setAttribute('transform', `translate(${ix},${iy})`);
    el.innerHTML = `
      <ellipse rx="${active?40:34}" ry="${active?26:22}"
               fill="${passed ? '#b39355' : '#c9a86a'}"
               stroke="${active ? '#c0392b' : '#8a6a35'}"
               stroke-width="${active?3:1.5}"
               opacity="${revealed ? .92 : .5}"/>
      ${revealed ? `<g transform="translate(0,-2)">${iconSvg(is.icon)}</g>` : ''}
      ${revealed ? `<text x="0" y="${active?42:37}" text-anchor="middle"
            font-size="${active?15:13}" font-weight="bold"
            fill="${active ? '#c0392b' : '#5b3a12'}">${is.name}</text>` : ''}
      ${passed ? '<path d="M22 -14 l5 6 l10 -12" stroke="#2e7d32" stroke-width="3.5" fill="none" stroke-linecap="round"/>' : ''}
    `;
    g.appendChild(el);
  });
}

/* Schiffsposition: liegt es an einer Insel oder fährt es? */
function shipProgress(){
  const info = currentIslandInfo();
  if(info.state === "at"){
    // Schiff liegt an der Insel -> Position der Insel
    return dateToProgress(ISLANDS[info.index].arrive);
  }
  return getProgress();
}

/* Ist das Schiff gerade an einer Insel? -> seitlich rüberrücken */
function shipIslandOffset(){
  const info = currentIslandInfo();
  if(info.state === "at"){
    const side = (info.index % 2 === 0) ? -1 : 1;
    return side * 78;
  }
  return 0;
}

/* ---------- GEGNER-SCHIFF (LeninaBallerina) ---------- */
/* Lenina ist schon fast am Ziel ("dramatisch knapp").
   ENEMY_BASE = wie weit sie mindestens vorne ist (0.86 = 86% der Reise).
   Sie klettert langsam Richtung Ziel, bleibt aber immer VOR Gusti,
   und erst wenn Gusti selbst fast oben ist, schliesst er knapp auf. */
const ENEMY_BASE = 0.58;   // Grundposition: deutlich vorne, aber nicht am Ziel
const ENEMY_MAX  = 0.90;   // so nah darf sie ans Ziel (nie ganz -> Gusti gewinnt)

function enemyProgress(){
  const p = getProgress();
  // von ENEMY_BASE aus Richtung ENEMY_MAX kriechen
  let e = ENEMY_BASE + (ENEMY_MAX - ENEMY_BASE) * p;
  // Sicherheit: immer ein gutes Stück vor Gusti
  e = Math.max(e, p + 0.18);
  return Math.min(ENEMY_MAX, e);
}

function positionEnemy(){
  const svg   = document.getElementById('map-svg');
  const route = document.getElementById('route');
  const enemy = document.getElementById('enemy-ship');
  if(!enemy) return;

  enemy.style.display = 'block';

  const len = route.getTotalLength();
  const pt  = route.getPointAtLength(len * enemyProgress());

  const ctm = route.getScreenCTM();
  if(!ctm) return;
  const sp = svg.createSVGPoint();
  // leicht seitlich versetzt, damit es Gustis Schiff nicht überlappt
  sp.x = pt.x + 32;
  sp.y = pt.y;
  const screen = sp.matrixTransform(ctm);

  enemy.style.left = screen.x + 'px';
  enemy.style.top  = screen.y + 'px';
}

/* ---------- KANONENKUGELN zwischen den Schiffen ---------- */
let cannonTimer = null;

function shipScreenCenter(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height*0.4 };
}

function fireCannonball(fromEl, toEl){
  if(!fromEl || !toEl) return;
  if(fromEl.style.display === 'none' || toEl.style.display === 'none') return;

  const a = shipScreenCenter(fromEl);
  const b = shipScreenCenter(toEl);

  // Kugel fliegt nur ~72% der Strecke -> trifft NIE, platscht davor ins Wasser
  const missAt = 0.62 + Math.random()*0.16;   // zwischen 62% und 78%
  const landX  = a.x + (b.x - a.x) * missAt;
  const landY  = a.y + (b.y - a.y) * missAt;

  const ball = document.createElement('div');
  ball.className = 'cannonball';
  ball.style.left = a.x + 'px';
  ball.style.top  = a.y + 'px';
  ball.style.transform = 'translate(-50%,-50%)';
  stage.appendChild(ball);

  // Bogen (Parabel) über einen Zwischen-Hochpunkt
  const midX = (a.x + landX)/2;
  const arcH = 40 + Math.random()*40;   // Flughöhe
  const midY = Math.min(a.y, landY) - arcH;

  const dur = 900 + Math.random()*300;
  const anim = ball.animate([
    { left:a.x+'px',   top:a.y+'px',   offset:0 },
    { left:midX+'px',  top:midY+'px',  offset:.5 },
    { left:landX+'px', top:landY+'px', offset:1 }
  ], { duration:dur, easing:'ease-out', fill:'forwards' });

  anim.onfinish = ()=>{
    ball.remove();
    splashAt(landX, landY);
  };
}

function splashAt(x, y){
  const s = document.createElement('div');
  s.className = 'splash';
  s.style.left = x + 'px';
  s.style.top  = y + 'px';
  stage.appendChild(s);
  s.animate([
    { transform:'translate(-50%,-50%) scale(0)',   opacity:.9 },
    { transform:'translate(-50%,-50%) scale(1.8)', opacity:0 }
  ], { duration:600, easing:'ease-out', fill:'forwards' });
  setTimeout(()=> s.remove(), 620);
}

function startCannonBattle(){
  const ship  = document.getElementById('ship');
  const enemy = document.getElementById('enemy-ship');
  if(cannonTimer) clearInterval(cannonTimer);

  function volley(){
    // mal feuert Gusti, mal die Gegnerin
    if(Math.random() < 0.5) fireCannonball(ship, enemy);
    else                    fireCannonball(enemy, ship);
    // gelegentlich ein schneller Doppelschuss
    if(Math.random() < 0.4){
      setTimeout(()=>{
        if(Math.random() < 0.5) fireCannonball(enemy, ship);
        else                    fireCannonball(ship, enemy);
      }, 380);
    }
  }

  // erster Schuss nach kurzer Verzögerung, dann immer wieder
  setTimeout(volley, 1200);
  cannonTimer = setInterval(volley, 2600);
}

/* ---------- Schatzkarte ---------- */
function showMap(){
  const map = document.getElementById('map');
  person.style.display = 'none';
  hat.style.display    = 'none';
  pickup.style.display = 'none';
  document.getElementById('celebrate').style.display='none';

  map.style.display='block';
  requestAnimationFrame(()=> map.classList.add('show'));

  const p = shipProgress();

  // erst nach dem Einblenden positionieren (Layout muss stehen)
  setTimeout(()=>{
    drawIslands();
    drawRoute(p);
    positionShip(shipProgress(), shipIslandOffset());
    positionEnemy();
    // Nach dem normalen Setzen: prüfen, ob heute eine Flaschenpost wartet
    maybeStartBottleDetour(p);
    maybeShowEnemyBottle();
    // Kanonen-Duell starten, sobald beide Schiffe stehen
    startCannonBattle();
  }, 300);

  const pctEl = document.getElementById('pct');
  const target = Math.round(p*100);
  let cur = 0;
  const step = Math.max(1, Math.round(target/40));
  const timer = setInterval(()=>{
    cur += step;
    if(cur >= target){ cur = target; clearInterval(timer); }
    pctEl.textContent = cur + '%';
  }, 30);

  document.getElementById('bar-fill').style.width = (p*100) + '%';

  if(p >= 1){
    setTimeout(()=>{
      const foundEl = document.getElementById('found');
      foundEl.style.display='flex';
      requestAnimationFrame(()=> foundEl.classList.add('open'));
      burstConfetti();
    }, 2500);
  }
}

/* ---------- FLASCHENPOST-ABSTECHER ----------
   An einem Flaschenpost-Tag:
   - kind "task"  -> Schiff kommt vom Kurs ab, fährt zur Seite, dockt an,
                     daneben erscheint die Flaschenpost.
   - kind "reply" -> Schiff bleibt AUF KURS, die Flaschenpost taucht
                     einfach neben dem Schiff auf (kurze Bestätigung). */
function maybeStartBottleDetour(baseProgress){
  const bottleData = bottleForToday();
  if(!bottleData) return;                 // heute keine Flaschenpost
  if(baseProgress >= 1) return;           // Ziel schon erreicht -> nichts

  const isReply = (bottleData.kind === "reply");

  const svg   = document.getElementById('map-svg');
  const route = document.getElementById('route');
  const ship  = document.getElementById('ship');
  const bottle = document.getElementById('bottle');
  const bottleHint = document.getElementById('bottle-hint');

  const len = route.getTotalLength();

  // Punkt auf der Route bei aktuellem Fortschritt
  const basePt = route.getPointAtLength(len * baseProgress);

  // Abstecher-Ziel: seitlich vom Kurs abkommen (mal links, mal rechts,
  // je nach Tag, damit es abwechslungsreich wirkt)
  const dayNum = today().getDate();
  const side   = (dayNum % 2 === 0) ? 1 : -1;

  // Bei "reply" bleibt das Schiff auf Kurs -> kein seitlicher Versatz
  const detourDX = isReply ? 0 : side * 96;   // wie weit seitlich raus
  const detourDY = isReply ? 0 : -46;         // etwas nach "vorne" (oben)

  // in Bildschirm-Koordinaten umrechnen
  const ctm = route.getScreenCTM();
  if(!ctm) return;

  function toScreen(x, y){
    const sp = svg.createSVGPoint();
    sp.x = x; sp.y = y;
    return sp.matrixTransform(ctm);
  }

  const shipTarget   = toScreen(basePt.x + detourDX,        basePt.y + detourDY);
  // Flasche liegt bei "reply" einfach seitlich neben dem Schiff
  const bottleSide   = isReply ? side * 60 : side * 54;
  const bottleTarget = toScreen(basePt.x + detourDX + bottleSide, basePt.y + detourDY - 6);

  if(isReply){
    // Schiff bleibt auf Kurs -> nur Flaschenpost neben ihm einblenden
    setTimeout(()=>{
      bottle.style.left = bottleTarget.x + 'px';
      bottle.style.top  = bottleTarget.y + 'px';
      bottle.style.display = 'block';

      bottleHint.style.left = bottleTarget.x + 'px';
      bottleHint.style.top  = (bottleTarget.y + 34) + 'px';
      bottleHint.style.display = 'block';
    }, 1600);
  } else {
    // 1) kurz warten (Schiff steht erst auf Kurs), dann seitlich wegfahren
    setTimeout(()=>{
      ship.style.left = shipTarget.x + 'px';
      ship.style.top  = shipTarget.y + 'px';
    }, 1600);

    // 2) Flaschenpost auftauchen lassen, sobald das Schiff angedockt hat
    setTimeout(()=>{
      bottle.style.left = bottleTarget.x + 'px';
      bottle.style.top  = bottleTarget.y + 'px';
      bottle.style.display = 'block';

      bottleHint.style.left = bottleTarget.x + 'px';
      bottleHint.style.top  = (bottleTarget.y + 34) + 'px';
      bottleHint.style.display = 'block';
    }, 3200);
  }

  // Klick auf die Flasche -> Nachricht öffnen
  bottle.onclick = ()=> openLetter(bottleData);
}

/* ---------- GEGNER-FLASCHENPOST (LeninaBallerina) ----------
   Erscheint direkt beim Gegner-Schiff und bleibt über den ganzen
   Zeitraum (z.B. 3 Tage) klickbar. Nutzt eine eigene Flasche-Kopie. */
let enemyBottleEl = null;
let enemyBottleHintEl = null;

function maybeShowEnemyBottle(){
  const data = enemyBottleForToday();

  // Wenn keine aktive Gegner-Nachricht: evtl. vorhandene entfernen
  if(!data){
    if(enemyBottleEl){ enemyBottleEl.remove(); enemyBottleEl = null; }
    if(enemyBottleHintEl){ enemyBottleHintEl.remove(); enemyBottleHintEl = null; }
    return;
  }

  const enemy = document.getElementById('enemy-ship');
  if(!enemy || enemy.style.display === 'none') return;

  // Position DIREKT aus Leninas Route-Punkt berechnen (nicht aus dem
  // gerade fahrenden Schiff -> sonst landet die Flasche daneben).
  const svg   = document.getElementById('map-svg');
  const route = document.getElementById('route');
  const ctm   = route.getScreenCTM();
  if(!ctm) return;
  const len = route.getTotalLength();
  const pt  = route.getPointAtLength(len * enemyProgress());
  const sp  = svg.createSVGPoint();
  // etwas seitlich (auf die dem Kurs abgewandte Seite) und leicht darunter
  sp.x = pt.x + 60;
  sp.y = pt.y + 28;
  const scr = sp.matrixTransform(ctm);
  const bx = scr.x;
  const by = scr.y;

  // Flasche erstellen (falls noch nicht vorhanden)
  if(!enemyBottleEl){
    enemyBottleEl = document.getElementById('bottle').cloneNode(true);
    enemyBottleEl.id = 'enemy-bottle';
    enemyBottleEl.style.display = 'block';
    // roter Ring -> als "böse" Nachricht kennzeichnen (überschreibt Standard leicht)
    enemyBottleEl.style.filter = 'drop-shadow(0 4px 8px rgba(120,0,0,.6))';
    stage.appendChild(enemyBottleEl);
    enemyBottleEl.onclick = ()=> openLetter(data);

    enemyBottleHintEl = document.createElement('div');
    enemyBottleHintEl.id = 'enemy-bottle-hint';
    enemyBottleHintEl.style.cssText =
      'position:absolute; z-index:24; transform:translate(-50%,0);' +
      'color:#7a1212; font-weight:bold; text-align:center; width:max-content;' +
      'max-width:60vw; text-shadow:0 1px 4px rgba(242,226,189,.9); pointer-events:none;' +
      'font-size:clamp(.8rem,3.4vw,1.05rem);';
    enemyBottleHintEl.innerHTML = 'Nachricht der Gegnerin! 💀<br>Tippe drauf';
    enemyBottleHintEl.style.animation = 'pulse2 1.8s ease-in-out infinite';
    stage.appendChild(enemyBottleHintEl);
  }

  enemyBottleEl.style.left = bx + 'px';
  enemyBottleEl.style.top  = by + 'px';
  enemyBottleHintEl.style.left = bx + 'px';
  enemyBottleHintEl.style.top  = (by + 30) + 'px';
}

/* Flaschenpost öffnen */
function openLetter(bottleData){
  const letter     = document.getElementById('letter');
  const letterHead = document.querySelector('#letter-inner h2');
  const letterDate = document.getElementById('letter-date');
  const letterTask = document.getElementById('letter-task');
  const letterClose= document.getElementById('letter-close');
  const letterInner= document.getElementById('letter-inner');
  const bottle     = document.getElementById('bottle');
  const bottleHint = document.getElementById('bottle-hint');

  const isReply = (bottleData.kind === "reply");
  const isEnemy = (bottleData.kind === "enemy");

  // Überschrift + Knopf je nach Art
  if(isEnemy){
    letterHead.textContent = "💀 Botschaft von " + (bottleData.from || "der Gegnerin");
    letterClose.textContent = "Das werden wir ja sehen!";
    letterClose.style.background = "linear-gradient(#1a1a1a,#000)";
    letterInner.style.borderColor = "#7a1212";
  } else if(isReply){
    letterHead.textContent = "⚓ Nachricht vom Ausguck";
    letterClose.textContent = "Volle Kraft voraus!";
    letterClose.style.background = "linear-gradient(#2e7d32,#1f5d24)";
    letterInner.style.borderColor = "#b08a48";
  } else {
    letterHead.textContent = "🏴‍☠️ Flaschenpost";
    letterClose.textContent = "Aye, verstanden!";
    letterClose.style.background = "linear-gradient(#c0392b,#a5281b)";
    letterInner.style.borderColor = "#b08a48";
  }

  // Datum hübsch anzeigen
  const d = bottleData.date;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  letterDate.textContent = `Angespült am ${dd}.${mm}.${d.getFullYear()}`;
  letterTask.textContent = bottleData.task;

  // Alle Flaschen + Hinweise ausblenden
  bottle.style.display = 'none';
  bottleHint.style.display = 'none';
  if(enemyBottleEl) enemyBottleEl.style.display = 'none';
  if(enemyBottleHintEl) enemyBottleHintEl.style.display = 'none';

  letter.style.display = 'flex';
  requestAnimationFrame(()=> letter.classList.add('show'));

  // merken, welche Flasche offen war (für Wieder-Einblenden nach Schließen)
  letter.dataset.openKind = bottleData.kind || 'task';
}

/* Flaschenpost schließen */
document.getElementById('letter-close').addEventListener('click', ()=>{
  const letter = document.getElementById('letter');
  letter.classList.remove('show');
  setTimeout(()=> letter.style.display = 'none', 500);

  // Gegner-Flasche bleibt über den ganzen Zeitraum sichtbar -> wieder einblenden
  if(letter.dataset.openKind === 'enemy' && enemyBottleForToday()){
    if(enemyBottleEl) enemyBottleEl.style.display = 'block';
    if(enemyBottleHintEl) enemyBottleHintEl.style.display = 'block';
  }
});

/* ---------- Zurückgelegten Weg rot einfärben ---------- */
function drawRoute(p){
  const el  = document.getElementById('route-done');
  const len = el.getTotalLength();
  el.style.transition = 'none';
  el.style.strokeDasharray  = len;
  el.style.strokeDashoffset = len;
  el.getBoundingClientRect();
  el.style.transition = 'stroke-dashoffset 2s ease';
  el.style.strokeDashoffset = len * (1 - p);
}

/* ---------- Schiff auf den Pfad setzen ---------- */
function positionShip(p, offsetX){
  const svg   = document.getElementById('map-svg');
  const route = document.getElementById('route');
  const ship  = document.getElementById('ship');

  const len = route.getTotalLength();
  const pt  = route.getPointAtLength(len * p);

  const ctm = route.getScreenCTM();
  if(!ctm) return;
  const sp = svg.createSVGPoint();
  sp.x = pt.x + (offsetX || 0);
  sp.y = pt.y;
  const screen = sp.matrixTransform(ctm);

  ship.style.left = screen.x + 'px';
  ship.style.top  = screen.y + 'px';
}

window.addEventListener('resize', ()=>{
  if(document.getElementById('map').style.display === 'block'){
    drawIslands();
    positionShip(shipProgress(), shipIslandOffset());
    positionEnemy();
    maybeShowEnemyBottle();
    // Bei Größenänderung Flaschenpost-Position neu berechnen,
    // falls gerade ein Abstecher läuft
    const bottle = document.getElementById('bottle');
    if(bottle.style.display === 'block'){
      maybeStartBottleDetour(shipProgress());
    }
  }
});
</script>
